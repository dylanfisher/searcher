name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Package.swift's swift-tools-version is the pinned version. Select the
      # newest Xcode on the runner rather than naming one here, so that line
      # stays the only place the version is written.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: swift --version
      - run: ./scripts/setup
      - run: ./scripts/check
